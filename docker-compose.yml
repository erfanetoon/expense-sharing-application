services:
  app:
    build: .
    ports:
      - "4000:4000"
    environment:
      APP_ENV: production
      APP_PORT: 4000
      DB_FILE: /app/data/expense-sharing.sqlite
      MIGRATIONS_PATH: /app/backend/core/src/database/migrations
      FRONTEND_DIST: /app/frontend/web/dist
    volumes:
      - expense-data:/app/data

volumes:
  expense-data:
